version: "2"
run:
  # Lint the LocalStack integration test too.
  build-tags:
    - integration
linters:
  enable:
    - gosec
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
